name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperGalleryMaps-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish draft GitHub release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/release/app-release.apk "HyperGalleryMaps-${GITHUB_REF_NAME}.apk"

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "HyperGallery Maps ${{ github.ref_name }}"
          files: HyperGalleryMaps-*.apk
          body: |
            LSPosed module (libxposed API 101/102) that injects Google Maps tiles and global reverse geocoding into Xiaomi HyperOS Gallery (`com.hyper.gallery.plugin` / `com.miui.gallery`).

            ### Features
            - **Google Maps tile injection** for both the Map Album (`MapContainer`) and Photo Details mini-map (`StaticMapContainer`), keeping native photo clustering, pins, and gestures intact.
            - **Coordinate drift fix** outside mainland China so photo pins align accurately with Google Maps.
            - **Global reverse geocoding** replacing Baidu's hardcoded Chinese location naming with Android's `Geocoder` in the device's system language (`Locale.getDefault()`).
            - **Fast tile loading** with 8 worker threads, per-tile download deduplication, 100 MB disk cache, and automatic fallback to Baidu if Google is unreachable.
